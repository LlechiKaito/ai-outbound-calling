<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 自動架電システム - ダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .status-badge { @apply px-2 py-0.5 rounded-full text-xs font-medium; }
    .tab-active { @apply border-b-2 border-blue-500 text-blue-600 font-medium; }
    .tab-inactive { @apply text-gray-500 hover:text-gray-700; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- ヘッダー -->
  <header class="bg-white shadow-sm border-b">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-gray-900">AI 自動架電システム</h1>
        <p class="text-sm text-gray-500">ダッシュボード</p>
      </div>
      <div class="flex items-center gap-3">
        <a id="sheets-link" href="#" target="_blank" rel="noopener noreferrer"
           class="text-sm px-3 py-1.5 bg-green-50 text-green-700 rounded-md hover:bg-green-100 border border-green-200">
          Google Sheets を開く
        </a>
        <button id="btn-refresh" onclick="refreshAll()"
                class="text-sm px-3 py-1.5 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200">
          更新
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <!-- ライブアクティビティ -->
    <section id="live-activity" class="bg-white rounded-lg shadow-sm border p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <div id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></div>
          <h2 class="text-sm font-semibold text-gray-700 tracking-wide">ライブアクティビティ</h2>
          <span id="orchestrator-state" class="status-badge bg-gray-100 text-gray-600">待機中</span>
        </div>
        <div class="flex gap-2">
          <button onclick="orchestratorAction('start')" id="btn-start"
                  class="px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600 disabled:opacity-50">開始</button>
          <button onclick="orchestratorAction('pause')" id="btn-pause"
                  class="px-3 py-1 text-sm bg-yellow-500 text-white rounded hover:bg-yellow-600 disabled:opacity-50" disabled>一時停止</button>
          <button onclick="orchestratorAction('resume')" id="btn-resume"
                  class="px-3 py-1 text-sm bg-green-500 text-white rounded hover:bg-green-600 disabled:opacity-50" disabled>再開</button>
          <button onclick="orchestratorAction('stop')" id="btn-stop"
                  class="px-3 py-1 text-sm bg-red-500 text-white rounded hover:bg-red-600 disabled:opacity-50" disabled>停止</button>
        </div>
      </div>
      <p id="live-status-message" class="text-sm text-gray-600"></p>
      <div class="mt-3">
        <h3 class="text-xs font-semibold text-gray-500 mb-2">完了タスク</h3>
        <div id="activity-log-entries" class="space-y-1 max-h-40 overflow-y-auto text-xs text-gray-400">ログなし</div>
      </div>
    </section>

    <!-- KPI表示 -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white rounded-lg shadow-sm border p-4">
        <p class="text-xs text-gray-500">総架電数</p>
        <p id="kpi-total-called" class="text-2xl font-bold text-gray-900 mt-1">-</p>
      </div>
      <div class="bg-white rounded-lg shadow-sm border p-4">
        <p class="text-xs text-gray-500">通話成功率</p>
        <p id="kpi-success-rate" class="text-2xl font-bold text-blue-600 mt-1">-</p>
      </div>
      <div class="bg-white rounded-lg shadow-sm border p-4">
        <p class="text-xs text-gray-500">平均興味度</p>
        <p id="kpi-avg-interest" class="text-2xl font-bold text-purple-600 mt-1">-</p>
      </div>
      <div class="bg-white rounded-lg shadow-sm border p-4">
        <p class="text-xs text-gray-500">メール送信数</p>
        <p id="kpi-email-sent" class="text-2xl font-bold text-green-600 mt-1">-</p>
      </div>
    </section>

    <!-- リード一覧 + 追加 -->
    <section class="bg-white rounded-lg shadow-sm border">
      <div class="p-4 border-b flex items-center justify-between">
        <div class="flex items-center gap-4">
          <h2 class="font-semibold text-gray-900">架電リスト管理</h2>
          <nav class="flex gap-4 text-sm" id="lead-tabs">
            <button onclick="filterLeads('')" class="tab-active pb-1" data-tab="all">すべて</button>
            <button onclick="filterLeads('pending')" class="tab-inactive pb-1" data-tab="pending">未対応</button>
            <button onclick="filterLeads('following')" class="tab-inactive pb-1" data-tab="following">フォロー中</button>
            <button onclick="filterLeads('completed')" class="tab-inactive pb-1" data-tab="completed">対応済み</button>
          </nav>
        </div>
        <button onclick="toggleAddLeadForm()" id="btn-add-lead"
                class="px-3 py-1 text-sm bg-blue-500 text-white rounded hover:bg-blue-600">+ リード追加</button>
      </div>

      <!-- リード追加フォーム（初期非表示） -->
      <div id="add-lead-form" class="hidden p-4 bg-blue-50 border-b">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
          <input type="text" id="new-company" placeholder="会社名"
                 class="px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
          <input type="text" id="new-contact" placeholder="担当者名"
                 class="px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
          <input type="tel" id="new-phone" placeholder="09012345678"
                 class="px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
          <input type="email" id="new-email" placeholder="email@example.com"
                 class="px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
          <div class="flex gap-2">
            <button onclick="submitNewLead()" class="px-4 py-2 bg-blue-500 text-white text-sm rounded-md hover:bg-blue-600 flex-1">追加</button>
            <button onclick="toggleAddLeadForm()" class="px-3 py-2 bg-gray-200 text-gray-700 text-sm rounded-md hover:bg-gray-300">キャンセル</button>
          </div>
        </div>
        <p id="add-lead-error" class="text-red-500 text-xs mt-2 hidden"></p>
      </div>

      <!-- リードテーブル -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left text-xs text-gray-500">
            <tr>
              <th class="px-4 py-3">会社名</th>
              <th class="px-4 py-3">担当者</th>
              <th class="px-4 py-3">電話番号</th>
              <th class="px-4 py-3">ステータス</th>
              <th class="px-4 py-3">架電結果</th>
              <th class="px-4 py-3">興味度</th>
              <th class="px-4 py-3">最終架電</th>
              <th class="px-4 py-3">次のアクション</th>
              <th class="px-4 py-3">リトライ</th>
              <th class="px-4 py-3">操作</th>
            </tr>
          </thead>
          <tbody id="leads-tbody" class="divide-y">
            <tr><td colspan="10" class="px-4 py-8 text-center text-gray-400">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 架電履歴一覧 -->
    <section class="bg-white rounded-lg shadow-sm border">
      <div class="p-4 border-b">
        <h2 class="font-semibold text-gray-900">架電履歴一覧</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 text-left text-xs text-gray-500">
            <tr>
              <th class="px-4 py-3">日時</th>
              <th class="px-4 py-3">会社名</th>
              <th class="px-4 py-3">担当者</th>
              <th class="px-4 py-3">結果</th>
              <th class="px-4 py-3">興味度</th>
              <th class="px-4 py-3">メモ</th>
            </tr>
          </thead>
          <tbody id="history-tbody" class="divide-y">
            <tr><td colspan="6" class="px-4 py-8 text-center text-gray-400">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 編集モーダル -->
  <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
      <h3 class="text-lg font-semibold text-gray-900 mb-4">リード編集</h3>
      <input type="hidden" id="edit-row-index">
      <div class="space-y-3">
        <div>
          <label class="block text-sm text-gray-600 mb-1">会社名</label>
          <input type="text" id="edit-company"
                 class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">担当者名</label>
          <input type="text" id="edit-contact"
                 class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">電話番号</label>
          <input type="tel" id="edit-phone"
                 class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm text-gray-600 mb-1">メールアドレス</label>
          <input type="email" id="edit-email"
                 class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
      </div>
      <p id="edit-lead-error" class="text-red-500 text-xs mt-2 hidden"></p>
      <div class="flex gap-2 mt-4">
        <button onclick="submitEditLead()" id="btn-edit-submit"
                class="px-4 py-2 bg-blue-500 text-white text-sm rounded-md hover:bg-blue-600 flex-1">保存</button>
        <button onclick="closeEditModal()"
                class="px-3 py-2 bg-gray-200 text-gray-700 text-sm rounded-md hover:bg-gray-300">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1/dist/axios.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/constants.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
